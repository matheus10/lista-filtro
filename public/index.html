<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minha lista — números</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1419;
        --card: #1a222c;
        --text: #e8eef4;
        --muted: #8b9aab;
        --ok: #3dd68c;
        --off: #f07178;
        --warn: #e6c07b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, Segoe UI, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 32px 20px 48px;
      }
      h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 6px; }
      .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
        max-width: 860px;
      }
      .card {
        background: var(--card);
        border-radius: 12px;
        padding: 16px 18px;
      }
      .card .n {
        font-size: 1.85rem;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .card .l { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }
      h2 { font-size: 1rem; margin: 36px 0 12px; font-weight: 600; }
      table { width: 100%; max-width: 860px; border-collapse: collapse; }
      th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #2a3440; font-size: 0.92rem; }
      th { color: var(--muted); font-weight: 500; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
      .on { background: var(--ok); }
      .off { background: var(--off); }
      .err { color: var(--off); }
      a { color: #7eb8ff; }
    </style>
  </head>
  <body>
    <h1>Números da lista</h1>
    <p class="sub" id="quando">Carregando…</p>
    <div class="grid" id="cards"></div>
    <h2>Listas-fonte</h2>
    <table>
      <thead>
        <tr><th>Lista</th><th>Status</th><th>Itens</th></tr>
      </thead>
      <tbody id="fontes"></tbody>
    </table>
    <p class="sub" style="margin-top:28px">
      Listas:
      <a href="/lista.m3u">completa</a> ·
      <a href="/lista-canal.m3u">canais</a> ·
      <a href="/lista-filme.m3u">filmes/séries</a>
    </p>
    <script>
      const fmt = (n) => Number(n || 0).toLocaleString("pt-BR");
      fetch("/stats.json", { cache: "no-store" })
        .then((r) => {
          if (!r.ok) throw new Error("sem stats");
          return r.json();
        })
        .then((s) => {
          const quando = s.atualizado_em
            ? new Date(s.atualizado_em).toLocaleString("pt-BR")
            : "—";
          const nota = s.validacao_tv
            ? "TV com teste real. Backup só se o outro host também estiver no ar. Filmes herdam a saúde do servidor."
            : "Validação de TV ainda não rodou neste deploy.";
          document.getElementById("quando").textContent = "Atualizado em " + quando + " · " + nota;
          const cards = [
            ["Filmes", s.filmes],
            ["Séries", s.series],
            ["TV online", s.tv_online],
            ["TV removida", s.tv_removidos],
            ["TV sem certeza", s.tv_incertos],
            ["Total na lista", s.total_na_lista],
            ["Antes do filtro", s.bruto],
            ["Depois (únicos)", s.apos_nome],
            ["Principais", s.principais],
            ["Backups", s.backups],
          ];
          document.getElementById("cards").innerHTML = cards
            .map(([l, n]) => '<div class="card"><div class="n">' + fmt(n) + '</div><div class="l">' + l + "</div></div>")
            .join("");
          document.getElementById("fontes").innerHTML = (s.fontes || [])
            .map((f) => {
              const ok = f.online;
              return (
                "<tr><td>" + (f.name || "") + "</td><td>" +
                '<span class="dot ' + (ok ? "on" : "off") + '"></span>' +
                (ok ? "online" : "offline") +
                (f.http ? " (HTTP " + f.http + ")" : "") +
                "</td><td>" + fmt(f.itens) + "</td></tr>"
              );
            })
            .join("");
        })
        .catch(() => {
          document.getElementById("quando").innerHTML =
            '<span class="err">Ainda sem números. Eles aparecem depois da próxima atualização das listas.</span>';
        });
    </script>
  </body>
</html>
