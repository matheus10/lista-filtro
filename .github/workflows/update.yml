name: Atualizador de Listas IPTV (M3U)

on:
  schedule:
    # A cada 4 dias as 06:00 UTC (03:00 em Brasilia). As fontes costumam
    # atualizar em ~7 dias; nao vale reprocessar a cada poucas horas.
    - cron: '0 6 */4 * *'
  workflow_dispatch:

concurrency:
  group: atualizador-listas-iptv
  cancel-in-progress: false

jobs:
  process_lists:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Restaurar cache de vereditos
        uses: actions/cache@v4
        with:
          path: cache/verdicts.json
          key: stream-verdicts-${{ github.run_id }}
          restore-keys: |
            stream-verdicts-

      - name: Executar Pipeline ETL
        env:
          FIREBASE_PUBLIC_DIR: ${{ github.workspace }}/public
          VALIDATE_STREAMS: "1"
          VALIDATE_FAST_TIMEOUT_SEC: "3"
          VALIDATE_TCP_TIMEOUT_SEC: "2"
          VALIDATE_TIMEOUT_SEC: "10"
          VALIDATE_CONCURRENCY: "30"
          VALIDATE_PER_HOST: "5"
          VALIDATE_PRECHECK_TCP: "1"
          VALIDATE_TV_ONLY: "1"
          VALIDATE_CONFIRM_DEAD: "1"
          VALIDATE_MAX_DROP_RATIO: "0.85"
          VALIDATE_VOD_SAMPLE: "12"
          VALIDATE_CACHE_PATH: ${{ github.workspace }}/cache/verdicts.json
          VALIDATE_CACHE_TTL_SEC: "345600"
        run: |
          mkdir -p cache
          cd src
          python main.py

      - name: Guardar artefatos das listas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listas-e-stats
          path: |
            public/lista.m3u
            public/lista-canal.m3u
            public/lista-filme.m3u
            public/stats.json
          if-no-files-found: warn

      # Publica no canal live: os mesmos caminhos (lista.m3u etc.) sao sobrescritos; URLs nao mudam.
      - name: Deploy no Firebase Hosting
        if: success()
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: minha-lista-c880d

      - name: Verificar se as listas saem como texto puro
        if: success()
        run: |
          sleep 15
          set +e
          for arquivo in lista.m3u lista-canal.m3u lista-filme.m3u; do
            cabecalhos=$(curl -sI "https://minha-lista-c880d.web.app/${arquivo}")
            tipo=$(printf '%s\n' "$cabecalhos" | grep -i '^content-type:' | tr -d '\r')
            echo "${arquivo}: ${tipo}"
            case "$tipo" in
              *text/plain*) ;;
              *)
                echo "ERRO: ${arquivo} nao esta como text/plain (o navegador abriria player)."
                exit 1
                ;;
            esac
            cache=$(printf '%s\n' "$cabecalhos" | grep -i '^cache-control:' | tr -d '\r')
            case "$cache" in
              *no-store*)
                echo "ERRO: ${arquivo} ainda tem no-store (a leitura pode ser cortada)."
                exit 1
                ;;
            esac
          done
