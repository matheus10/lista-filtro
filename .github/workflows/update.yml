name: Atualizador de Listas IPTV (M3U)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  process_lists:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar Pipeline ETL
        env:
          FIREBASE_PUBLIC_DIR: ${{ github.workspace }}/public
          VALIDATE_STREAMS: "1"
          VALIDATE_TIMEOUT_SEC: "8"
          VALIDATE_CONCURRENCY: "30"
          VALIDATE_PER_HOST: "5"
          VALIDATE_RECHECK_DEAD: "1"
          VALIDATE_MAX_DROP_RATIO: "0.85"
        run: |
          cd src
          python main.py

      # Publica no canal live: os mesmos caminhos (lista.m3u etc.) sao sobrescritos; URLs nao mudam.
      - name: Deploy no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: minha-lista-c880d


      - name: Verificar se as listas saem como texto puro
        run: |
          sleep 15
          set +e
          for arquivo in lista.m3u lista-canal.m3u lista-filme.m3u; do
            cabecalhos=$(curl -sI "https://minha-lista-c880d.web.app/${arquivo}")
            tipo=$(printf '%s\n' "$cabecalhos" | grep -i '^content-type:' | tr -d '\r')
            echo "${arquivo}: ${tipo}"
            case "$tipo" in
              *text/plain*) ;;
              *)
                echo "ERRO: ${arquivo} nao esta como text/plain (o navegador abriria player)."
                exit 1
                ;;
            esac
            cache=$(printf '%s\n' "$cabecalhos" | grep -i '^cache-control:' | tr -d '\r')
            case "$cache" in
              *no-store*)
                echo "ERRO: ${arquivo} ainda tem no-store (a leitura pode ser cortada)."
                exit 1
                ;;
            esac
          done
