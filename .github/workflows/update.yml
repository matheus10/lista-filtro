name: Atualizador de Listas IPTV (M3U)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  process_lists:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar Pipeline ETL
        env:
          FIREBASE_PUBLIC_DIR: ${{ github.workspace }}/public
        run: |
          cd src
          python main.py

      # Publica no canal live: os mesmos caminhos (lista.m3u etc.) sao sobrescritos; URLs nao mudam.
      - name: Deploy no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: minha-lista-c880d


      - name: Verificar se as listas saem como texto puro
        run: |
          sleep 15
          for arquivo in lista.m3u lista-canal.m3u lista-filme.m3u; do
            cabecalhos=$(curl -sI "https://minha-lista-c880d.web.app/${arquivo}")
            tipo=$(echo "$cabecalhos" | grep -i '^content-type:' | tr -d '\r')
            echo "${arquivo}: ${tipo}"
            echo "${tipo}" | grep -qi 'text/plain' || {
              echo "ERRO: ${arquivo} nao esta como text/plain (o navegador abriria player)."
              exit 1
            }
            echo "$cabecalhos" | grep -i '^cache-control:' | grep -qi 'no-store' && {
              echo "ERRO: ${arquivo} ainda tem no-store (a leitura pode ser cortada)."
              exit 1
            }
          done
